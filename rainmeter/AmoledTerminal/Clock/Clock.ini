[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=AmoledTerminal

[Metadata]
Name=AMOLED Terminal - Clock
Author=windows-custom-walliee
Information=Minimal AMOLED dark-grey transparent terminal clock & uptime widget.
Version=1.0.0

[Variables]
@Include=#@#Variables.inc

[MeasureTime]
Measure=Time
Format=#TimeFormat#

[MeasureDate]
Measure=Time
Format=#DateFormat#

[MeasureUptime]
Measure=Uptime
Format="%4!02i!h:%3!02i!m"

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(112*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#
MouseOverAction=[!SetOption MeterBg Shape "Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(112*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgHover# | StrokeWidth 1 | Stroke Color #HighlightBorder#"][!UpdateMeter MeterBg][!Redraw]
MouseLeaveAction=[!SetOption MeterBg Shape "Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(112*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#"][!UpdateMeter MeterBg][!Redraw]
LeftMouseUpAction=["ms-clock:"]

[MeterDot]
Meter=Shape
X=(Round(18*#S#))
Y=(Round(16*#S#))
Shape=Ellipse (Round(3*#S#)),(Round(3*#S#)),(Max(1,Round(3*#S#))) | Fill Color #TermGreen# | StrokeWidth 0

[MeterHeader]
Meter=String
X=(Round(30*#S#))
Y=(Round(11*#S#))
FontFace=#FontMono#
FontSize=(9*#FS#)
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="// sys.time"

[MeterUptime]
Meter=String
MeasureName=MeasureUptime
X=(Round(254*#S#))
Y=(Round(11*#S#))
FontFace=#FontMono#
FontSize=(9*#FS#)
FontWeight=500
FontColor=#TextMuted#
StringAlign=Right
AntiAlias=1
Text="up %1"

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=(Round(136*#S#))
Y=(Round(30*#S#))
FontFace=#FontMono#
FontSize=(28*#FS#)
FontWeight=700
FontColor=#TextPrimary#
StringAlign=CenterTop
AntiAlias=1
Text="%1"

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=(Round(136*#S#))
Y=(Round(82*#S#))
FontFace=#FontMono#
FontSize=(10*#FS#)
FontWeight=500
FontColor=#TextSecondary#
StringAlign=CenterTop
AntiAlias=1
Text="%1"
