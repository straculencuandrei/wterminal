[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=AMOLED Terminal - Clock
Author=windows-custom-walliee
Information=Minimal AMOLED dark-grey transparent terminal clock & uptime widget.
Version=1.0.0

[Variables]
@Include=#@#Variables.inc

[MeasureTime]
Measure=Time
Format=#TimeFormat#

[MeasureDate]
Measure=Time
Format=#DateFormat#

[MeasureUptime]
Measure=Uptime
Format="%4!02i!h:%3!02i!m"

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,272,112,14 | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#
MouseOverAction=[!SetOption MeterBg Shape "Rectangle 0,0,272,112,14 | Fill Color #BgHover# | StrokeWidth 1 | Stroke Color #HighlightBorder#"][!UpdateMeter MeterBg][!Redraw]
MouseLeaveAction=[!SetOption MeterBg Shape "Rectangle 0,0,272,112,14 | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#"][!UpdateMeter MeterBg][!Redraw]
LeftMouseUpAction=["ms-clock:"]

[MeterDot]
Meter=Shape
X=18
Y=16
Shape=Ellipse 3,3,3 | Fill Color #TermGreen# | StrokeWidth 0

[MeterHeader]
Meter=String
X=30
Y=11
FontFace=#FontMono#
FontSize=9
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="// sys.time"

[MeterUptime]
Meter=String
MeasureName=MeasureUptime
X=254
Y=11
FontFace=#FontMono#
FontSize=9
FontWeight=500
FontColor=#TextMuted#
StringAlign=Right
AntiAlias=1
Text="up %1"

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=136
Y=30
FontFace=#FontMono#
FontSize=28
FontWeight=700
FontColor=#TextPrimary#
StringAlign=CenterTop
AntiAlias=1
Text="%1"

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=136
Y=82
FontFace=#FontMono#
FontSize=10
FontWeight=500
FontColor=#TextSecondary#
StringAlign=CenterTop
AntiAlias=1
Text="%1"
