[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!CommandMeasure MeasureGpuCmd "Run"]

[Metadata]
Name=AMOLED Terminal - GpuThermals
Author=windows-custom-walliee
Information=Live NVIDIA GPU temperature, utilization, and VRAM widget via nvidia-smi.
Version=1.0.0

[Variables]
@Include=#@#Variables.inc

[MeasureTicker]
Measure=Calc
Formula=MeasureTicker + 1
IfCondition=(MeasureTicker > 2) && ((MeasureTicker % 10) = 0)
IfTrueAction=[!CommandMeasure MeasureGpuCmd "Run"]

[MeasureGpuCmd]
Measure=Plugin
Plugin=RunCommand
Program=C:\Windows\System32\nvidia-smi.exe
Parameter=--query-gpu=temperature.gpu,utilization.gpu,memory.used,memory.total --format=csv,noheader,nounits
State=Hide
OutputType=ANSI
FinishAction=[!UpdateMeasureGroup GpuParse][!UpdateMeter *][!Redraw]

[MeasureGpuTemp]
Measure=String
String=[MeasureGpuCmd]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^(\d+).*":"\1"
Group=GpuParse

[MeasureGpuLoad]
Measure=String
String=[MeasureGpuCmd]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^[^,]+,\s*(\d+).*":"\1"
Group=GpuParse

[MeasureGpuLoadNum]
Measure=Calc
Formula=MeasureGpuLoad
MinValue=0
MaxValue=100
DynamicVariables=1
Group=GpuParse

[MeasureVramUsed]
Measure=String
String=[MeasureGpuCmd]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^[^,]+,\s*[^,]+,\s*(\d+).*":"\1"
Group=GpuParse

[MeasureVramTotal]
Measure=String
String=[MeasureGpuCmd]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^[^,]+,\s*[^,]+,\s*[^,]+,\s*(\d+).*":"\1"
Group=GpuParse

[MeasureVramPct]
Measure=Calc
Formula=(MeasureVramUsed / (MeasureVramTotal > 0 ? MeasureVramTotal : 1)) * 100
MinValue=0
MaxValue=100
DynamicVariables=1
Group=GpuParse

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,272,110,14 | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#
LeftMouseUpAction=[!CommandMeasure MeasureGpuCmd "Run"]

[MeterDot]
Meter=Shape
X=18
Y=16
Shape=Ellipse 3,3,3 | Fill Color #TermGreen# | StrokeWidth 0

[MeterHeader]
Meter=String
X=30
Y=11
FontFace=#FontMono#
FontSize=9
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="// gpu.rtx5050"

[MeterTempVal]
Meter=String
MeasureName=MeasureGpuTemp
X=254
Y=11
FontFace=#FontMono#
FontSize=10
FontWeight=700
FontColor=#TermGreen#
StringAlign=Right
AntiAlias=1
Text="%1°C"

[MeterLoadLabel]
Meter=String
X=18
Y=34
FontFace=#FontMono#
FontSize=10
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="load"

[MeterLoadVal]
Meter=String
MeasureName=MeasureGpuLoad
X=254
Y=34
FontFace=#FontMono#
FontSize=10
FontWeight=700
FontColor=#TextPrimary#
StringAlign=Right
AntiAlias=1
Text="%1%"

[MeterLoadBar]
Meter=Bar
MeasureName=MeasureGpuLoadNum
X=18
Y=52
W=236
H=3
BarOrientation=Horizontal
BarColor=#Accent#
SolidColor=#BarTrack#

[MeterVramLabel]
Meter=String
X=18
Y=65
FontFace=#FontMono#
FontSize=10
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="vram"

[MeterVramVal]
Meter=String
MeasureName=MeasureVramUsed
MeasureName2=MeasureVramTotal
X=254
Y=65
FontFace=#FontMono#
FontSize=10
FontWeight=700
FontColor=#TextPrimary#
StringAlign=Right
AntiAlias=1
Text="%1 / %2 MB"

[MeterVramBar]
Meter=Bar
MeasureName=MeasureVramPct
X=18
Y=83
W=236
H=3
BarOrientation=Horizontal
BarColor=#Accent#
SolidColor=#BarTrack#
