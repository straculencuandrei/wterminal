[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=AmoledTerminal
OnRefreshAction=[!CommandMeasure MeasureGpuCmd "Run"]

[Metadata]
Name=AMOLED Terminal - GpuThermals
Author=windows-custom-walliee
Information=Live NVIDIA GPU temperature, utilization, and VRAM widget via nvidia-smi.
Version=1.0.0

[Variables]
@Include=#@#Variables.inc

[MeasureTicker]
Measure=Calc
Formula=MeasureTicker + 1
IfCondition=(MeasureTicker > 2) && ((MeasureTicker % 10) = 0)
IfTrueAction=[!CommandMeasure MeasureGpuCmd "Run"]

[MeasureGpuCmd]
Measure=Plugin
Plugin=RunCommand
Program=C:\Windows\System32\nvidia-smi.exe
Parameter=--query-gpu=temperature.gpu,utilization.gpu,memory.used,memory.total --format=csv,noheader,nounits
State=Hide
OutputType=ANSI
FinishAction=[!UpdateMeasureGroup GpuParse][!UpdateMeter *][!Redraw]

[MeasureGpuTemp]
Measure=String
String=[MeasureGpuCmd]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^(\d+).*":"\1"
Group=GpuParse

[MeasureGpuLoad]
Measure=String
String=[MeasureGpuCmd]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^[^,]+,\s*(\d+).*":"\1"
Group=GpuParse

[MeasureGpuLoadNum]
Measure=Calc
Formula=MeasureGpuLoad
MinValue=0
MaxValue=100
DynamicVariables=1
Group=GpuParse

[MeasureVramUsed]
Measure=String
String=[MeasureGpuCmd]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^[^,]+,\s*[^,]+,\s*(\d+).*":"\1"
Group=GpuParse

[MeasureVramTotal]
Measure=String
String=[MeasureGpuCmd]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^[^,]+,\s*[^,]+,\s*[^,]+,\s*(\d+).*":"\1"
Group=GpuParse

[MeasureVramPct]
Measure=Calc
Formula=(MeasureVramUsed / (MeasureVramTotal > 0 ? MeasureVramTotal : 1)) * 100
MinValue=0
MaxValue=100
DynamicVariables=1
Group=GpuParse

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(110*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#
LeftMouseUpAction=[!CommandMeasure MeasureGpuCmd "Run"]

[MeterDot]
Meter=Shape
X=(Round(18*#S#))
Y=(Round(16*#S#))
Shape=Ellipse (Round(3*#S#)),(Round(3*#S#)),(Max(1,Round(3*#S#))) | Fill Color #TermGreen# | StrokeWidth 0

[MeterHeader]
Meter=String
X=(Round(30*#S#))
Y=(Round(11*#S#))
FontFace=#FontMono#
FontSize=(9*#S#)
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="// gpu.rtx5050"

[MeterTempVal]
Meter=String
MeasureName=MeasureGpuTemp
X=(Round(254*#S#))
Y=(Round(11*#S#))
FontFace=#FontMono#
FontSize=(10*#S#)
FontWeight=700
FontColor=#TermGreen#
StringAlign=Right
AntiAlias=1
Text="%1°C"

[MeterLoadLabel]
Meter=String
X=(Round(18*#S#))
Y=(Round(34*#S#))
FontFace=#FontMono#
FontSize=(10*#S#)
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="load"

[MeterLoadVal]
Meter=String
MeasureName=MeasureGpuLoad
X=(Round(254*#S#))
Y=(Round(34*#S#))
FontFace=#FontMono#
FontSize=(10*#S#)
FontWeight=700
FontColor=#TextPrimary#
StringAlign=Right
AntiAlias=1
Text="%1%"

[MeterLoadBar]
Meter=Bar
MeasureName=MeasureGpuLoadNum
X=(Round(18*#S#))
Y=(Round(52*#S#))
W=(Max(1,Round(236*#S#)))
H=(Max(1,Round(3*#S#)))
BarOrientation=Horizontal
BarColor=#Accent#
SolidColor=#BarTrack#

[MeterVramLabel]
Meter=String
X=(Round(18*#S#))
Y=(Round(65*#S#))
FontFace=#FontMono#
FontSize=(10*#S#)
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="vram"

[MeterVramVal]
Meter=String
MeasureName=MeasureVramUsed
MeasureName2=MeasureVramTotal
X=(Round(254*#S#))
Y=(Round(65*#S#))
FontFace=#FontMono#
FontSize=(10*#S#)
FontWeight=700
FontColor=#TextPrimary#
StringAlign=Right
AntiAlias=1
Text="%1 / %2 MB"

[MeterVramBar]
Meter=Bar
MeasureName=MeasureVramPct
X=(Round(18*#S#))
Y=(Round(83*#S#))
W=(Max(1,Round(236*#S#)))
H=(Max(1,Round(3*#S#)))
BarOrientation=Horizontal
BarColor=#Accent#
SolidColor=#BarTrack#
