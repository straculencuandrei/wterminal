[Rainmeter]
Update=60000
AccurateText=1
DynamicWindowSize=1
Group=AmoledTerminal

[Metadata]
Name=AMOLED Terminal - Calendar
Author=windows-custom-walliee
Information=Minimal 7-day rolling week calendar strip with today highlight.
Version=1.0.0

[Variables]
@Include=#@#Variables.inc

[MeasureMonth]
Measure=Time
Format=%B %Y

[MeasureWeekScript]
Measure=Script
ScriptFile=#@#WeekCal.lua

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(82*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#
LeftMouseUpAction=["ms-clock:"]

[MeterDot]
Meter=Shape
X=(Round(18*#S#))
Y=(Round(16*#S#))
Shape=Ellipse (Round(3*#S#)),(Round(3*#S#)),(Max(1,Round(3*#S#))) | Fill Color #TermGreen# | StrokeWidth 0

[MeterHeader]
Meter=String
X=(Round(30*#S#))
Y=(Round(11*#S#))
FontFace=#FontMono#
FontSize=(9*#S#)
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="// sys.cal"

[MeterMonth]
Meter=String
MeasureName=MeasureMonth
X=(Round(254*#S#))
Y=(Round(11*#S#))
FontFace=#FontMono#
FontSize=(9*#S#)
FontWeight=500
FontColor=#TextMuted#
StringAlign=Right
AntiAlias=1
Text="%1"

[MeterTodayPill]
Meter=Shape
X=(Round(15*#S#))
Y=(Round(50*#S#))
Shape=Rectangle 0,0,(Max(1,Round(26*#S#))),(Max(1,Round(20*#S#))),(Max(1,Round(6*#S#))) | Fill Color #TermGreen# | StrokeWidth 0

[MeterDayLbl1]
Meter=String
X=(Round(28*#S#))
Y=(Round(34*#S#))
FontFace=#FontMono#
FontSize=(8*#S#)
FontWeight=500
FontColor=#TextMuted#
StringAlign=Center
