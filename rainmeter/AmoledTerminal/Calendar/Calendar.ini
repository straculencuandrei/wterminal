[Rainmeter]
Update=60000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=AMOLED Terminal - Calendar
Author=windows-custom-walliee
Information=Minimal 7-day rolling week calendar strip with today highlight.
Version=1.0.0

[Variables]
@Include=#@#Variables.inc

[MeasureMonth]
Measure=Time
Format=%B %Y

[MeasureWeekScript]
Measure=Script
ScriptFile=#@#WeekCal.lua

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,272,82,14 | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#
LeftMouseUpAction=["ms-clock:"]

[MeterDot]
Meter=Shape
X=18
Y=16
Shape=Ellipse 3,3,3 | Fill Color #TermGreen# | StrokeWidth 0

[MeterHeader]
Meter=String
X=30
Y=11
FontFace=#FontMono#
FontSize=9
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="// sys.cal"

[MeterMonth]
Meter=String
MeasureName=MeasureMonth
X=254
Y=11
FontFace=#FontMono#
FontSize=9
FontWeight=500
FontColor=#TextMuted#
StringAlign=Right
AntiAlias=1
Text="%1"

[MeterTodayPill]
Meter=Shape
X=15
Y=50
Shape=Rectangle 0,0,26,20,6 | Fill Color #TermGreen# | StrokeWidth 0

[MeterDayLbl1]
