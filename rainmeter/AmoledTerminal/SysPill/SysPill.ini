[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=AMOLED Terminal - SysPill
Author=windows-custom-walliee
Information=Minimal AMOLED dark-grey transparent terminal telemetry widget (CPU, RAM, Net).
Version=1.0.0

[Variables]
@Include=#@#Variables.inc

[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=PhysicalMemory

[MeasureNetIn]
Measure=NetIn
NetInSpeed=100000000

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,272,122,14 | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#
MouseOverAction=[!SetOption MeterBg Shape "Rectangle 0,0,272,122,14 | Fill Color #BgHover# | StrokeWidth 1 | Stroke Color #HighlightBorder#"][!UpdateMeter MeterBg][!Redraw]
MouseLeaveAction=[!SetOption MeterBg Shape "Rectangle 0,0,272,122,14 | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#"][!UpdateMeter MeterBg][!Redraw]
LeftMouseUpAction=["taskmgr.exe"]

[MeterDot]
Meter=Shape
X=18
Y=16
Shape=Ellipse 3,3,3 | Fill Color #TermGreen# | StrokeWidth 0

[MeterHeader]
Meter=String
X=30
Y=11
FontFace=#FontMono#
FontSize=9
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="// sys.mon"

[MeterCpuLabel]
Meter=String
X=18
Y=34
FontFace=#FontMono#
FontSize=10
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="cpu"

[MeterCpuVal]
Meter=String
MeasureName=MeasureCPU
X=254
Y=34
FontFace=#FontMono#
FontSize=10
FontWeight=700
FontColor=#TextPrimary#
StringAlign=Right
AntiAlias=1
Text="%1%"

[MeterCpuBar]
Meter=Bar
MeasureName=MeasureCPU
X=18
Y=52
W=236
H=3
BarOrientation=Horizontal
BarColor=#Accent#
SolidColor=#BarTrack#

[MeterRamLabel]
Meter=String
X=18
Y=65
FontFace=#FontMono#
FontSize=10
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="ram"

[MeterRamVal]
Meter=String
MeasureName=MeasureRAM
X=254
Y=65
FontFace=#FontMono#
FontSize=10
FontWeight=700
FontColor=#TextPrimary#
StringAlign=Right
AntiAlias=1
Percentual=1
Text="%1%"

[MeterRamBar]
Meter=Bar
MeasureName=MeasureRAM
X=18
Y=83
W=236
H=3
BarOrientation=Horizontal
BarColor=#Accent#
SolidColor=#BarTrack#

[MeterNetLabel]
Meter=String
X=18
Y=97
FontFace=#FontMono#
FontSize=9
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="net.rx"

[MeterNetVal]
Meter=String
MeasureName=MeasureNetIn
X=254
Y=97
FontFace=#FontMono#
FontSize=9
FontWeight=700
FontColor=#TermGreen#
StringAlign=Right
AntiAlias=1
AutoScale=1
NumOfDecimals=1
Text="%1B/s"
