[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=AmoledTerminal

[Metadata]
Name=AMOLED Terminal - SysPill
Author=windows-custom-walliee
Information=Minimal AMOLED terminal telemetry widget (CPU temp, CPU %, RAM %, Net).
Version=1.1.0

[Variables]
@Include=#@#Variables.inc

[MeasureCpuTemp]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=MaxTemperature
Substitute="0":"--"

[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=PhysicalMemory

[MeasureNetIn]
Measure=NetIn
NetInSpeed=100000000

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(122*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#
MouseOverAction=[!SetOption MeterBg Shape "Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(122*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgHover# | StrokeWidth 1 | Stroke Color #HighlightBorder#"][!UpdateMeter MeterBg][!Redraw]
MouseLeaveAction=[!SetOption MeterBg Shape "Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(122*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#"][!UpdateMeter MeterBg][!Redraw]
LeftMouseUpAction=["taskmgr.exe"]

[MeterDot]
Meter=Shape
X=(Round(18*#S#))
Y=(Round(16*#S#))
Shape=Ellipse (Round(3*#S#)),(Round(3*#S#)),(Max(1,Round(3*#S#))) | Fill Color #TermGreen# | StrokeWidth 0

[MeterHeader]
Meter=String
X=(Round(30*#S#))
Y=(Round(11*#S#))
FontFace=#FontMono#
FontSize=(9*#S#)
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="// sys.mon"

[MeterCpuTemp]
Meter=String
MeasureName=MeasureCpuTemp
X=(Round(254*#S#))
Y=(Round(11*#S#))
FontFace=#FontMono#
FontSize=(9*#S#)
FontWeight=700
FontColor=#TermGreen#
StringAlign=Right
AntiAlias=1
Text="cpu %1°C"
ToolTipText="CPU Temp (click to open Core Temp)"
LeftMouseUpAction=["C:\Program Files\Core Temp\Core Temp.exe"]

[MeterCpuLabel]
Meter=String
X=(Round(18*#S#))
Y=(Round(34*#S#))
FontFace=#FontMono#
FontSize=(10*#S#)
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="cpu"

[MeterCpuVal]
Meter=String
MeasureName=MeasureCPU
X=(Round(254*#S#))
Y=(Round(34*#S#))
FontFace=#FontMono#
FontSize=(10*#S#)
FontWeight=700
FontColor=#TextPrimary#
StringAlign=Right
AntiAlias=1
Text="%1%"

[MeterCpuBar]
Meter=Bar
MeasureName=MeasureCPU
X=(Round(18*#S#))
Y=(Round(52*#S#))
W=(Max(1,Round(236*#S#)))
H=(Max(1,Round(3*#S#)))
BarOrientation=Horizontal
BarColor=#Accent#
SolidColor=#BarTrack#

[MeterRamLabel]
Meter=String
X=(Round(18*#S#))
Y=(Round(65*#S#))
FontFace=#FontMono#
FontSize=(10*#S#)
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="ram"

[MeterRamVal]
Meter=String
MeasureName=MeasureRAM
X=(Round(254*#S#))
Y=(Round(65*#S#))
FontFace=#FontMono#
FontSize=(10*#S#)
FontWeight=700
FontColor=#TextPrimary#
StringAlign=Right
AntiAlias=1
Percentual=1
Text="%1%"

[MeterRamBar]
Meter=Bar
MeasureName=MeasureRAM
X=(Round(18*#S#))
Y=(Round(83*#S#))
W=(Max(1,Round(236*#S#)))
H=(Max(1,Round(3*#S#)))
BarOrientation=Horizontal
BarColor=#Accent#
SolidColor=#BarTrack#

[MeterNetLabel]
Meter=String
X=(Round(18*#S#))
Y=(Round(97*#S#))
FontFace=#FontMono#
FontSize=(9*#S#)
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="net.rx"

[MeterNetVal]
Meter=String
MeasureName=MeasureNetIn
X=(Round(254*#S#))
Y=(Round(97*#S#))
FontFace=#FontMono#
FontSize=(9*#S#)
FontWeight=700
FontColor=#TermGreen#
StringAlign=Right
AntiAlias=1
AutoScale=1
NumOfDecimals=1
Text="%1B/s"
