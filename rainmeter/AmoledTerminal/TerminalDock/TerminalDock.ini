[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=AMOLED Terminal - TerminalDock
Author=windows-custom-walliee
Information=Minimal terminal command dock pill with Terminal, Files, Web, Widget Settings, and Layout Reset.
Version=1.1.0

[Variables]
@Include=#@#Variables.inc

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,272,42,12 | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#

[MeterBtnWt]
Meter=String
X=30
Y=21
FontFace=#FontMono#
FontSize=10
FontWeight=700
FontColor=#TextSecondary#
StringAlign=CenterCenter
AntiAlias=1
Text="> wt"
MouseOverAction=[!SetOption MeterBtnWt FontColor "#TermGreen#"][!UpdateMeter MeterBtnWt][!Redraw]
MouseLeaveAction=[!SetOption MeterBtnWt FontColor "#TextSecondary#"][!UpdateMeter MeterBtnWt][!Redraw]
LeftMouseUpAction=["wt.exe"]

[MeterSep1]
Meter=Shape
X=58
Y=12
Shape=Rectangle 0,0,1,18 | Fill Color 255,255,255,20 | StrokeWidth 0

[MeterBtnFiles]
Meter=String
X=86
Y=21
FontFace=#FontMono#
FontSize=10
FontWeight=700
FontColor=#TextSecondary#
StringAlign=CenterCenter
AntiAlias=1
Text="dir"
MouseOverAction=[!SetOption MeterBtnFiles FontColor "#TextPrimary#"][!UpdateMeter MeterBtnFiles][!Redraw]
MouseLeaveAction=[!SetOption MeterBtnFiles FontColor "#TextSecondary#"][!UpdateMeter MeterBtnFiles][!Redraw]
LeftMouseUpAction=["explorer.exe"]

[MeterSep2]
Meter=Shape
X=114
Y=12
Shape=Rectangle 0,0,1,18 | Fill Color 255,255,255,20 | StrokeWidth 0

[MeterBtnWeb]
Meter=String
X=140
Y=21
FontFace=#FontMono#
FontSize=10
FontWeight=700
FontColor=#TextSecondary#
StringAlign=CenterCenter
AntiAlias=1
Text="web"
MouseOverAction=[!SetOption MeterBtnWeb FontColor "#TextPrimary#"][!UpdateMeter MeterBtnWeb][!Redraw]
MouseLeaveAction=[!SetOption MeterBtnWeb FontColor "#TextSecondary#"][!UpdateMeter MeterBtnWeb][!Redraw]
LeftMouseUpAction=["https://"]

[MeterSep3]
Meter=Shape
X=166
Y=12
Shape=Rectangle 0,0,1,18 | Fill Color 255,255,255,20 | StrokeWidth 0

[MeterBtnUi]
Meter=String
X=192
Y=21
FontFace=#FontMono#
FontSize=10
FontWeight=700
FontColor=#TextSecondary#
StringAlign=CenterCenter
AntiAlias=1
Text="cfg"
ToolTipText="Toggle Widget Settings Panel"
MouseOverAction=[!SetOption MeterBtnUi FontColor "#TermGreen#"][!UpdateMeter MeterBtnUi][!Redraw]
MouseLeaveAction=[!SetOption MeterBtnUi FontColor "#TextSecondary#"][!UpdateMeter MeterBtnUi][!Redraw]
LeftMouseUpAction=[!ToggleConfig "AmoledTerminal\Settings" "Settings.ini"]

[MeterSep4]
Meter=Shape
X=218
Y=12
Shape=Rectangle 0,0,1,18 | Fill Color 255,255,255,20 | StrokeWidth 0

[MeterBtnRst]
Meter=String
X=245
Y=21
FontFace=#FontMono#
FontSize=10
FontWeight=700
FontColor=#TextMuted#
StringAlign=CenterCenter
AntiAlias=1
Text="rst"
ToolTipText="Reset All Widgets to Default Positions"
MouseOverAction=[!SetOption MeterBtnRst FontColor "#TermGreen#"][!UpdateMeter MeterBtnRst][!Redraw]
MouseLeaveAction=[!SetOption MeterBtnRst FontColor "#TextMuted#"][!UpdateMeter MeterBtnRst][!Redraw]
LeftMouseUpAction=[!ActivateConfig "AmoledTerminal\HeroClock" "HeroClock.ini"][!Move 28 28 "AmoledTerminal\HeroClock"][!ZPos 0 "AmoledTerminal\HeroClock"][!ActivateConfig "AmoledTerminal\Weather" "Weather.ini"][!Move 28 162 "AmoledTerminal\Weather"][!ZPos 0 "AmoledTerminal\Weather"][!ActivateConfig "AmoledTerminal\Calendar" "Calendar.ini"][!Move 28 270 "AmoledTerminal\Calendar"][!ZPos 0 "AmoledTerminal\Calendar"][!ActivateConfig "AmoledTerminal\Notes" "Notes.ini"][!Move 28 364 "AmoledTerminal\Notes"][!ZPos 0 "AmoledTerminal\Notes"][!ActivateConfig "AmoledTerminal\SysPill" "SysPill.ini"][!Move (#SCREENAREAWIDTH#-300) 28 "AmoledTerminal\SysPill"][!ZPos 0 "AmoledTerminal\SysPill"][!ActivateConfig "AmoledTerminal\GpuThermals" "GpuThermals.ini"][!Move (#SCREENAREAWIDTH#-300) 162 "AmoledTerminal\GpuThermals"][!ZPos 0 "AmoledTerminal\GpuThermals"][!ActivateConfig "AmoledTerminal\PowerAudio" "PowerAudio.ini"][!Move (#SCREENAREAWIDTH#-300) 284 "AmoledTerminal\PowerAudio"][!ZPos 0 "AmoledTerminal\PowerAudio"][!ActivateConfig "AmoledTerminal\TerminalDock" "TerminalDock.ini"][!Move (#SCREENAREAWIDTH#-300) 406 "AmoledTerminal\TerminalDock"][!ZPos 0 "AmoledTerminal\TerminalDock"][!ActivateConfig "AmoledTerminal\AudioFFT" "AudioFFT.ini"][!Move (#WORKAREAWIDTH#/2-154) (#WORKAREAHEIGHT#-48) "AmoledTerminal\AudioFFT"][!ZPos 0 "AmoledTerminal\AudioFFT"]
