[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=AmoledTerminal

[Metadata]
Name=AMOLED Terminal - TerminalDock
Author=windows-custom-walliee
Information=Minimal terminal command dock pill with Terminal, Files, Web, Widget Settings, and Layout Reset.
Version=1.1.0

[Variables]
@Include=#@#Variables.inc

[MeasureLayout]
Measure=Script
ScriptFile=#@#Layout.lua
UpdateDivider=-1

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(42*#S#))),(Max(1,Round(12*#S#))) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#

[MeterBtnWt]
Meter=String
X=(Round(30*#S#))
Y=(Round(21*#S#))
FontFace=#FontMono#
FontSize=(10*#S#)
FontWeight=700
FontColor=#TextSecondary#
StringAlign=CenterCenter
AntiAlias=1
Text="> wt"
MouseOverAction=[!SetOption MeterBtnWt FontColor "#TermGreen#"][!UpdateMeter MeterBtnWt][!Redraw]
MouseLeaveAction=[!SetOption MeterBtnWt FontColor "#TextSecondary#"][!UpdateMeter MeterBtnWt][!Redraw]
LeftMouseUpAction=["wt.exe"]

[MeterSep1]
Meter=Shape
X=(Round(58*#S#))
Y=(Round(12*#S#))
Shape=Rectangle 0,0,(Max(1,Round(1*#S#))),(Max(1,Round(18*#S#))) | Fill Color 255,255,255,20 | StrokeWidth 0

[MeterBtnFiles]
Meter=String
X=(Round(86*#S#))
Y=(Round(21*#S#))
FontFace=#FontMono#
FontSize=(10*#S#)
FontWeight=700
FontColor=#TextSecondary#
StringAlign=CenterCenter
AntiAlias=1
Text="dir"
MouseOverAction=[!SetOption MeterBtnFiles FontColor "#TextPrimary#"][!UpdateMeter MeterBtnFiles][!Redraw]
MouseLeaveAction=[!SetOption MeterBtnFiles FontColor "#TextSecondary#"][!UpdateMeter MeterBtnFiles][!Redraw]
LeftMouseUpAction=["explorer.exe"]

[MeterSep2]
Meter=Shape
X=(Round(114*#S#))
Y=(Round(12*#S#))
Shape=Rectangle 0,0,(Max(1,Round(1*#S#))),(Max(1,Round(18*#S#))) | Fill Color 255,255,255,20 | StrokeWidth 0

[MeterBtnWeb]
Meter=String
X=(Round(140*#S#))
Y=(Round(21*#S#))
FontFace=#FontMono#
FontSize=(10*#S#)
FontWeight=700
FontColor=#TextSecondary#
StringAlign=CenterCenter
AntiAlias=1
Text="web"
MouseOverAction=[!SetOption MeterBtnWeb FontColor "#TextPrimary#"][!UpdateMeter MeterBtnWeb][!Redraw]
MouseLeaveAction=[!SetOption MeterBtnWeb FontColor "#TextSecondary#"][!UpdateMeter MeterBtnWeb][!Redraw]
LeftMouseUpAction=["https://"]

[MeterSep3]
Meter=Shape
X=(Round(166*#S#))
Y=(Round(12*#S#))
Shape=Rectangle 0,0,(Max(1,Round(1*#S#))),(Max(1,Round(18*#S#))) | Fill Color 255,255,255,20 | StrokeWidth 0

[MeterBtnUi]
Meter=String
X=(Round(192*#S#))
Y=(Round(21*#S#))
FontFace=#FontMono#
FontSize=(10*#S#)
FontWeight=700
FontColor=#TextSecondary#
StringAlign=CenterCenter
AntiAlias=1
Text="cfg"
ToolTipText="Toggle Widget Settings Panel"
MouseOverAction=[!SetOption MeterBtnUi FontColor "#TermGreen#"][!UpdateMeter MeterBtnUi][!Redraw]
MouseLeaveAction=[!SetOption MeterBtnUi FontColor "#TextSecondary#"][!UpdateMeter MeterBtnUi][!Redraw]
LeftMouseUpAction=[!ToggleConfig "AmoledTerminal\Settings" "Settings.ini"]

[MeterSep4]
Meter=Shape
X=(Round(218*#S#))
Y=(Round(12*#S#))
Shape=Rectangle 0,0,(Max(1,Round(1*#S#))),(Max(1,Round(18*#S#))) | Fill Color 255,255,255,20 | StrokeWidth 0

[MeterBtnRst]
Meter=String
X=(Round(245*#S#))
Y=(Round(21*#S#))
FontFace=#FontMono#
FontSize=(10*#S#)
FontWeight=700
FontColor=#TextMuted#
StringAlign=CenterCenter
AntiAlias=1
Text="rst"
ToolTipText="Reset All Widgets to Default Positions"
MouseOverAction=[!SetOption MeterBtnRst FontColor "#TermGreen#"][!UpdateMeter MeterBtnRst][!Redraw]
MouseLeaveAction=[!SetOption MeterBtnRst FontColor "#TextMuted#"][!UpdateMeter MeterBtnRst][!Redraw]
LeftMouseUpAction=[!CommandMeasure MeasureLayout "ResetLayout()"]
