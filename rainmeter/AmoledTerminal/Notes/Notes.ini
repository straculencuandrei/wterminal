[Rainmeter]
Update=3000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=AMOLED Terminal - Notes
Author=windows-custom-walliee
Information=Minimal AMOLED terminal scratchpad / todo widget reading @Resources/notes.txt.
Version=1.0.0

[Variables]
@Include=#@#Variables.inc

[MeasureNotes]
Measure=Script
ScriptFile=#@#ReadNotes.lua

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,272,140,14 | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#
MouseOverAction=[!SetOption MeterBg Shape "Rectangle 0,0,272,140,14 | Fill Color #BgHover# | StrokeWidth 1 | Stroke Color #HighlightBorder#"][!UpdateMeter MeterBg][!Redraw]
MouseLeaveAction=[!SetOption MeterBg Shape "Rectangle 0,0,272,140,14 | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#"][!UpdateMeter MeterBg][!Redraw]
LeftMouseUpAction=["#@#notes.txt"]

[MeterDot]
Meter=Shape
X=18
Y=16
Shape=Ellipse 3,3,3 | Fill Color #TermGreen# | StrokeWidth 0

[MeterHeader]
Meter=String
X=30
Y=11
FontFace=#FontMono#
FontSize=9
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="// notes.md"

[MeterEditHint]
Meter=String
X=254
Y=11
FontFace=#FontMono#
FontSize=9
FontWeight=500
FontColor=#TextMuted#
StringAlign=Right
AntiAlias=1
Text="[edit]"

[MeterBody]
Meter=String
MeasureName=MeasureNotes
X=18
Y=36
W=236
H=92
ClipString=2
FontFace=#FontMono#
FontSize=10
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="%1"
