[Rainmeter]
Update=3000
AccurateText=1
DynamicWindowSize=1
Group=AmoledTerminal

[Metadata]
Name=AMOLED Terminal - Notes
Author=windows-custom-walliee
Information=Minimal AMOLED terminal scratchpad / todo widget reading @Resources/notes.txt.
Version=1.0.0

[Variables]
@Include=#@#Variables.inc

[MeasureNotes]
Measure=Script
ScriptFile=#@#ReadNotes.lua

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(140*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#
MouseOverAction=[!SetOption MeterBg Shape "Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(140*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgHover# | StrokeWidth 1 | Stroke Color #HighlightBorder#"][!UpdateMeter MeterBg][!Redraw]
MouseLeaveAction=[!SetOption MeterBg Shape "Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(140*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#"][!UpdateMeter MeterBg][!Redraw]
LeftMouseUpAction=["#@#notes.txt"]

[MeterDot]
Meter=Shape
X=(Round(18*#S#))
Y=(Round(16*#S#))
Shape=Ellipse (Round(3*#S#)),(Round(3*#S#)),(Max(1,Round(3*#S#))) | Fill Color #TermGreen# | StrokeWidth 0

[MeterHeader]
Meter=String
X=(Round(30*#S#))
Y=(Round(11*#S#))
FontFace=#FontMono#
FontSize=(9*#S#)
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="// notes.md"

[MeterEditHint]
Meter=String
X=(Round(254*#S#))
Y=(Round(11*#S#))
FontFace=#FontMono#
FontSize=(9*#S#)
FontWeight=500
FontColor=#TextMuted#
StringAlign=Right
AntiAlias=1
Text="[edit]"

[MeterBody]
Meter=String
MeasureName=MeasureNotes
X=(Round(18*#S#))
Y=(Round(36*#S#))
W=(Max(1,Round(236*#S#)))
H=(Max(1,Round(92*#S#)))
ClipString=2
FontFace=#FontMono#
FontSize=(10*#S#)
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="%1"
