MouseLeaveAction=[!SetOption MeterT4 FontColor "#TextSecondary#"][!UpdateMeter MeterT4][!Redraw]
LeftMouseUpAction=[!ToggleConfig "AmoledTerminal\Notes" "Notes.ini"]

