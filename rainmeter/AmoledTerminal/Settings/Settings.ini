[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=AMOLED Terminal - Settings
Author=windows-custom-walliee
Information=Control panel for resetting widget layout, toggling widgets, and switching desktop layers.
Version=1.0.0

[Variables]
@Include=#@#Variables.inc
ResetAction=[!ActivateConfig "AmoledTerminal\HeroClock" "HeroClock.ini"][!Move 28 50 "AmoledTerminal\HeroClock"][!ZPos 0 "AmoledTerminal\HeroClock"][!ActivateConfig "AmoledTerminal\Weather" "Weather.ini"][!Move 28 184 "AmoledTerminal\Weather"][!ZPos 0 "AmoledTerminal\Weather"][!ActivateConfig "AmoledTerminal\Calendar" "Calendar.ini"][!Move 28 292 "AmoledTerminal\Calendar"][!ZPos 0 "AmoledTerminal\Calendar"][!ActivateConfig "AmoledTerminal\Notes" "Notes.ini"][!Move 28 386 "AmoledTerminal\Notes"][!ZPos 0 "AmoledTerminal\Notes"][!ActivateConfig "AmoledTerminal\SysPill" "SysPill.ini"][!Move (#SCREENAREAWIDTH#-300) 50 "AmoledTerminal\SysPill"][!ZPos 0 "AmoledTerminal\SysPill"][!ActivateConfig "AmoledTerminal\GpuThermals" "GpuThermals.ini"][!Move (#SCREENAREAWIDTH#-300) 184 "AmoledTerminal\GpuThermals"][!ZPos 0 "AmoledTerminal\GpuThermals"][!ActivateConfig "AmoledTerminal\PowerAudio" "PowerAudio.ini"][!Move (#SCREENAREAWIDTH#-300) 306 "AmoledTerminal\PowerAudio"][!ZPos 0 "AmoledTerminal\PowerAudio"][!ActivateConfig "AmoledTerminal\TerminalDock" "TerminalDock.ini"][!Move (#SCREENAREAWIDTH#-300) 428 "AmoledTerminal\TerminalDock"][!ZPos 0 "AmoledTerminal\TerminalDock"][!ActivateConfig "AmoledTerminal\AudioFFT" "AudioFFT.ini"][!Move (#SCREENAREAWIDTH#/2-154) (#SCREENAREAHEIGHT#-124) "AmoledTerminal\AudioFFT"][!ZPos 0 "AmoledTerminal\AudioFFT"]
LayerNormal=[!ZPos 0 "AmoledTerminal\HeroClock"][!ZPos 0 "AmoledTerminal\Weather"][!ZPos 0 "AmoledTerminal\Calendar"][!ZPos 0 "AmoledTerminal\Notes"][!ZPos 0 "AmoledTerminal\SysPill"][!ZPos 0 "AmoledTerminal\GpuThermals"][!ZPos 0 "AmoledTerminal\PowerAudio"][!ZPos 0 "AmoledTerminal\TerminalDock"][!ZPos 0 "AmoledTerminal\AudioFFT"]
LayerTop=[!ZPos 1 "AmoledTerminal\HeroClock"][!ZPos 1 "AmoledTerminal\Weather"][!ZPos 1 "AmoledTerminal\Calendar"][!ZPos 1 "AmoledTerminal\Notes"][!ZPos 1 "AmoledTerminal\SysPill"][!ZPos 1 "AmoledTerminal\GpuThermals"][!ZPos 1 "AmoledTerminal\PowerAudio"][!ZPos 1 "AmoledTerminal\TerminalDock"][!ZPos 1 "AmoledTerminal\AudioFFT"]

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,280,328,14 | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#

[MeterDot]
Meter=Shape
X=18
Y=16
Shape=Ellipse 3,3,3 | Fill Color #TermGreen# | StrokeWidth 0

[MeterHeader]
Meter=String
X=30
Y=11
FontFace=#FontMono#
FontSize=9
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="// wterminal.cfg"

[MeterClose]
Meter=String
X=262
Y=11
FontFace=#FontMono#
FontSize=10
FontWeight=700
FontColor=#TextMuted#
StringAlign=Right
AntiAlias=1
Text="[x]"
MouseOverAction=[!SetOption MeterClose FontColor "#TextPrimary#"][!UpdateMeter MeterClose][!Redraw]
MouseLeaveAction=[!SetOption MeterClose FontColor "#TextMuted#"][!UpdateMeter MeterClose][!Redraw]
LeftMouseUpAction=[!DeactivateConfig]

; Primary Reset Button
[MeterResetBtn]
Meter=Shape
X=18
Y=38
Shape=Rectangle 0,0,244,28,8 | Fill Color 74,222,128,32 | StrokeWidth 1 | Stroke Color 74,222,128,110
MouseOverAction=[!SetOption MeterResetBtn Shape "Rectangle 0,0,244,28,8 | Fill Color 74,222,128,58 | StrokeWidth 1 | Stroke Color #TermGreen#"][!UpdateMeter MeterResetBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterResetBtn Shape "Rectangle 0,0,244,28,8 | Fill Color 74,222,128,32 | StrokeWidth 1 | Stroke Color 74,222,128,110"][!UpdateMeter MeterResetBtn][!Redraw]
LeftMouseUpAction=#ResetAction#

[MeterResetTxt]
Meter=String
X=140
Y=52
FontFace=#FontMono#
FontSize=10
FontWeight=700
FontColor=#TermGreen#
StringAlign=CenterCenter
AntiAlias=1
Text="reset default layout"

; Layer & Refresh Row
[MeterLayerNorm]
Meter=String
X=18
Y=78
FontFace=#FontMono#
FontSize=9
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="[layer: desktop]"
MouseOverAction=[!SetOption MeterLayerNorm FontColor "#TextPrimary#"][!UpdateMeter MeterLayerNorm][!Redraw]
MouseLeaveAction=[!SetOption MeterLayerNorm FontColor "#TextSecondary#"][!UpdateMeter MeterLayerNorm][!Redraw]
LeftMouseUpAction=#LayerNormal#

[MeterLayerTop]
Meter=String
X=262
Y=78
FontFace=#FontMono#
FontSize=9
FontWeight=500
FontColor=#TextSecondary#
StringAlign=Right
AntiAlias=1
Text="[layer: topmost]"
MouseOverAction=[!SetOption MeterLayerTop FontColor "#TextPrimary#"][!UpdateMeter MeterLayerTop][!Redraw]
MouseLeaveAction=[!SetOption MeterLayerTop FontColor "#TextSecondary#"][!UpdateMeter MeterLayerTop][!Redraw]
LeftMouseUpAction=#LayerTop#

[MeterDiv1]
Meter=Shape
X=18
Y=102
Shape=Rectangle 0,0,244,1 | Fill Color 255,255,255,22 | StrokeWidth 0

[MeterTogHdr]
Meter=String
X=18
Y=110
FontFace=#FontMono#
FontSize=9
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="toggle widgets"

; 2-column widget toggles
[MeterT1]
Meter=String
X=18
Y=134
FontFace=#FontMono#
FontSize=10
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="> clock"
MouseOverAction=[!SetOption MeterT1 FontColor "#TermGreen#"][!UpdateMeter MeterT1][!Redraw]
MouseLeaveAction=[!SetOption MeterT1 FontColor "#TextSecondary#"][!UpdateMeter MeterT1][!Redraw]
LeftMouseUpAction=[!ToggleConfig "AmoledTerminal\HeroClock" "HeroClock.ini"]

