LeftMouseUpAction=[!ToggleConfig "AmoledTerminal\GpuThermals" "GpuThermals.ini"]

[MeterT7]
Meter=String
X=(Round(18*#S#))
Y=(Round(206*#S#))
FontFace=#FontMono#
FontSize=(10*#FS#)
FontWeight=500
FontColor=#TextSecondary#
