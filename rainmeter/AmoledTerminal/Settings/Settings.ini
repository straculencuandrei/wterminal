[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=AmoledTerminal

[Metadata]
Name=AMOLED Terminal - Settings
Author=windows-custom-walliee
Information=Control panel for resetting widget layout, toggling widgets, and switching desktop layers.
Version=1.0.0

[Variables]
@Include=#@#Variables.inc
ResetAction=[!CommandMeasure MeasureLayout "ResetLayout()"]
LayerNormal=[!ZPos 0 "AmoledTerminal\HeroClock"][!ZPos 0 "AmoledTerminal\Weather"][!ZPos 0 "AmoledTerminal\Calendar"][!ZPos 0 "AmoledTerminal\Notes"][!ZPos 0 "AmoledTerminal\SysPill"][!ZPos 0 "AmoledTerminal\GpuThermals"][!ZPos 0 "AmoledTerminal\PowerAudio"][!ZPos 0 "AmoledTerminal\TerminalDock"][!ZPos 0 "AmoledTerminal\AudioFFT"]
LayerTop=[!ZPos 1 "AmoledTerminal\HeroClock"][!ZPos 1 "AmoledTerminal\Weather"][!ZPos 1 "AmoledTerminal\Calendar"][!ZPos 1 "AmoledTerminal\Notes"][!ZPos 1 "AmoledTerminal\SysPill"][!ZPos 1 "AmoledTerminal\GpuThermals"][!ZPos 1 "AmoledTerminal\PowerAudio"][!ZPos 1 "AmoledTerminal\TerminalDock"][!ZPos 1 "AmoledTerminal\AudioFFT"]

[MeasureLayout]
Measure=Script
ScriptFile=#@#Layout.lua
UpdateDivider=-1

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,(Max(1,Round(280*#S#))),(Max(1,Round(328*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#

[MeterDot]
Meter=Shape
X=(Round(18*#S#))
Y=(Round(16*#S#))
Shape=Ellipse (Round(3*#S#)),(Round(3*#S#)),(Max(1,Round(3*#S#))) | Fill Color #TermGreen# | StrokeWidth 0

[MeterHeader]
Meter=String
X=(Round(30*#S#))
Y=(Round(11*#S#))
FontFace=#FontMono#
FontSize=(9*#FS#)
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="// wterminal.cfg"

[MeterClose]
Meter=String
X=(Round(262*#S#))
Y=(Round(11*#S#))
FontFace=#FontMono#
FontSize=(10*#FS#)
FontWeight=700
FontColor=#TextMuted#
StringAlign=Right
AntiAlias=1
Text="[x]"
MouseOverAction=[!SetOption MeterClose FontColor "#TextPrimary#"][!UpdateMeter MeterClose][!Redraw]
MouseLeaveAction=[!SetOption MeterClose FontColor "#TextMuted#"][!UpdateMeter MeterClose][!Redraw]
LeftMouseUpAction=[!DeactivateConfig]

; Primary Reset Button
[MeterResetBtn]
Meter=Shape
X=(Round(18*#S#))
Y=(Round(38*#S#))
Shape=Rectangle 0,0,(Max(1,Round(244*#S#))),(Max(1,Round(28*#S#))),(Max(1,Round(8*#S#))) | Fill Color 74,222,128,32 | StrokeWidth 1 | Stroke Color 74,222,128,110
MouseOverAction=[!SetOption MeterResetBtn Shape "Rectangle 0,0,(Max(1,Round(244*#S#))),(Max(1,Round(28*#S#))),(Max(1,Round(8*#S#))) | Fill Color 74,222,128,58 | StrokeWidth 1 | Stroke Color #TermGreen#"][!UpdateMeter MeterResetBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterResetBtn Shape "Rectangle 0,0,(Max(1,Round(244*#S#))),(Max(1,Round(28*#S#))),(Max(1,Round(8*#S#))) | Fill Color 74,222,128,32 | StrokeWidth 1 | Stroke Color 74,222,128,110"][!UpdateMeter MeterResetBtn][!Redraw]
LeftMouseUpAction=#ResetAction#

[MeterResetTxt]
Meter=String
X=(Round(140*#S#))
Y=(Round(52*#S#))
FontFace=#FontMono#
FontSize=(10*#FS#)
FontWeight=700
FontColor=#TermGreen#
StringAlign=CenterCenter
AntiAlias=1
Text="reset default layout"

; Layer & Refresh Row
[MeterLayerNorm]
Meter=String
X=(Round(18*#S#))
Y=(Round(78*#S#))
FontFace=#FontMono#
FontSize=(9*#FS#)
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="[layer: desktop]"
MouseOverAction=[!SetOption MeterLayerNorm FontColor "#TextPrimary#"][!UpdateMeter MeterLayerNorm][!Redraw]
MouseLeaveAction=[!SetOption MeterLayerNorm FontColor "#TextSecondary#"][!UpdateMeter MeterLayerNorm][!Redraw]
LeftMouseUpAction=#LayerNormal#

[MeterLayerTop]
Meter=String
X=(Round(262*#S#))
Y=(Round(78*#S#))
FontFace=#FontMono#
FontSize=(9*#FS#)
FontWeight=500
FontColor=#TextSecondary#
StringAlign=Right
AntiAlias=1
Text="[layer: topmost]"
MouseOverAction=[!SetOption MeterLayerTop FontColor "#TextPrimary#"][!UpdateMeter MeterLayerTop][!Redraw]
MouseLeaveAction=[!SetOption MeterLayerTop FontColor "#TextSecondary#"][!UpdateMeter MeterLayerTop][!Redraw]
LeftMouseUpAction=#LayerTop#

[MeterDiv1]
Meter=Shape
X=(Round(18*#S#))
Y=(Round(102*#S#))
Shape=Rectangle 0,0,(Max(1,Round(244*#S#))),(Max(1,Round(1*#S#))) | Fill Color 255,255,255,22 | StrokeWidth 0

[MeterTogHdr]
Meter=String
X=(Round(18*#S#))
Y=(Round(110*#S#))
FontFace=#FontMono#
FontSize=(9*#FS#)
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="toggle widgets"

; 2-column widget toggles
[MeterT1]
Meter=String
X=(Round(18*#S#))
Y=(Round(134*#S#))
FontFace=#FontMono#
FontSize=(10*#FS#)
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="> clock"
MouseOverAction=[!SetOption MeterT1 FontColor "#TermGreen#"][!UpdateMeter MeterT1][!Redraw]
MouseLeaveAction=[!SetOption MeterT1 FontColor "#TextSecondary#"][!UpdateMeter MeterT1][!Redraw]
LeftMouseUpAction=[!ToggleConfig "AmoledTerminal\HeroClock" "HeroClock.ini"]

[MeterT2]
