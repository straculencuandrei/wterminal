MouseOverAction=[!SetOption MeterT5 FontColor "#TermGreen#"][!UpdateMeter MeterT5][!Redraw]
MouseLeaveAction=[!SetOption MeterT5 FontColor "#TextSecondary#"][!UpdateMeter MeterT5][!Redraw]
LeftMouseUpAction=[!ToggleConfig "AmoledTerminal\SysPill" "SysPill.ini"]

