MouseLeaveAction=[!SetOption MeterT3 FontColor "#TextSecondary#"][!UpdateMeter MeterT3][!Redraw]
LeftMouseUpAction=[!ToggleConfig "AmoledTerminal\Calendar" "Calendar.ini"]

