MouseOverAction=[!SetOption MeterEditTheme FontColor "#TextPrimary#"][!UpdateMeter MeterEditTheme][!Redraw]
MouseLeaveAction=[!SetOption MeterEditTheme FontColor "#TextSecondary#"][!UpdateMeter MeterEditTheme][!Redraw]
LeftMouseUpAction=["#@#Variables.inc"]

[MeterEditNotes]
Meter=String
X=18
Y=272
FontFace=#FontMono#
FontSize=10
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="edit notes.txt"
MouseOverAction=[!SetOption MeterEditNotes FontColor "#TextPrimary#"][!UpdateMeter MeterEditNotes][!Redraw]
MouseLeaveAction=[!SetOption MeterEditNotes FontColor "#TextSecondary#"][!UpdateMeter MeterEditNotes][!Redraw]
