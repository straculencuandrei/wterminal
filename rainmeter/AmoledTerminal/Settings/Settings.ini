[MeterDiv2]
Meter=Shape
X=(Round(18*#S#))
Y=(Round(236*#S#))
Shape=Rectangle 0,0,(Max(1,Round(244*#S#))),(Max(1,Round(1*#S#))) | Fill Color 255,255,255,22 | StrokeWidth 0

; Config & System Quick Links
[MeterEditTheme]
Meter=String
X=(Round(18*#S#))
Y=(Round(248*#S#))
FontFace=#FontMono#
FontSize=(10*#FS#)
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="edit variables.inc"
MouseOverAction=[!SetOption MeterEditTheme FontColor "#TextPrimary#"][!UpdateMeter MeterEditTheme][!Redraw]
MouseLeaveAction=[!SetOption MeterEditTheme FontColor "#TextSecondary#"][!UpdateMeter MeterEditTheme][!Redraw]
LeftMouseUpAction=["#@#Variables.inc"]

[MeterEditNotes]
Meter=String
X=(Round(18*#S#))
Y=(Round(272*#S#))
FontFace=#FontMono#
FontSize=(10*#FS#)
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="edit notes.txt"
MouseOverAction=[!SetOption MeterEditNotes FontColor "#TextPrimary#"][!UpdateMeter MeterEditNotes][!Redraw]
MouseLeaveAction=[!SetOption MeterEditNotes FontColor "#TextSecondary#"][!UpdateMeter MeterEditNotes][!Redraw]
LeftMouseUpAction=["#@#notes.txt"]

[MeterRefreshAll]
Meter=String
X=(Round(18*#S#))
Y=(Round(296*#S#))
FontFace=#FontMono#
FontSize=(10*#FS#)
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="refresh all skins"
MouseOverAction=[!SetOption MeterRefreshAll FontColor "#TermGreen#"][!UpdateMeter MeterRefreshAll][!Redraw]
MouseLeaveAction=[!SetOption MeterRefreshAll FontColor "#TextSecondary#"][!UpdateMeter MeterRefreshAll][!Redraw]
LeftMouseUpAction=[!RefreshApp]

[MeterWinPrefs]
Meter=String
X=(Round(262*#S#))
Y=(Round(296*#S#))
FontFace=#FontMono#
FontSize=(10*#FS#)
FontWeight=500
FontColor=#TextMuted#
StringAlign=Right
AntiAlias=1
Text="[win settings]"
MouseOverAction=[!SetOption MeterWinPrefs FontColor "#TextPrimary#"][!UpdateMeter MeterWinPrefs][!Redraw]
MouseLeaveAction=[!SetOption MeterWinPrefs FontColor "#TextMuted#"][!UpdateMeter MeterWinPrefs][!Redraw]
LeftMouseUpAction=["ms-settings:"]
