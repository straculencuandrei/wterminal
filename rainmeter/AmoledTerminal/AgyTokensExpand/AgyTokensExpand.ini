; Card Frame (304 x 356)
[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,(Max(1,Round(304*#S#))),(Max(1,Round(356*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#

[MeterTitle]
