[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=AmoledTerminal
OnRefreshAction=[!CommandMeasure MeasureAgyCmd "Run"][!CommandMeasure MeasureLayout "PositionExpand()" "AmoledTerminal\HeroClock"]

[Metadata]
Name=AMOLED Terminal - AgyTokensExpand
Author=windows-custom-walliee
Information=Expanded Antigravity Usage drawer showing limits, spent, remaining, reset timers, and circular gauges.
Version=1.1.0

[Variables]
@Include=#@#Variables.inc

[MeasureTicker]
Measure=Calc
Formula=MeasureTicker + 1
IfCondition=(MeasureTicker > 2) && ((MeasureTicker % 15) = 0)
IfTrueAction=[!CommandMeasure MeasureAgyCmd "Run"]

[MeasureAgyCmd]
Measure=Plugin
Plugin=RunCommand
Program=python
Parameter="#@#GetAgyUsage.py" #AgyContextLimit# #AgyDailyLimit# expand #Agy5hLimit# #AgyWeeklyLimit#
State=Hide
OutputType=UTF8
FinishAction=[!UpdateMeasureGroup AgyExp][!UpdateMeter *][!Redraw]

; Group headers
[MeasureH1]
Measure=String
String=[MeasureAgyCmd]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^([^|\r\n]*)\|.*":"\1"
Group=AgyExp

[MeasureH2]
Measure=String
String=[MeasureAgyCmd]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^(?:[^|]*\|){1}([^|\r\n]*)\|.*":"\1"
Group=AgyExp

