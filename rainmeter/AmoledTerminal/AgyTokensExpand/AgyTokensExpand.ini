; Card Frame (304 x 356)
[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,(Max(1,Round(304*#S#))),(Max(1,Round(356*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#

[MeterTitle]
Meter=String
X=(Round(18*#S#))
Y=(Round(13*#S#))
FontFace=#FontText#
FontSize=(11*#S#)
FontWeight=600
FontColor=#TextSecondary#
AntiAlias=1
Text="Usage"

[MeterEditBtn]
Meter=String
X=(Round(256*#S#))
Y=(Round(13*#S#))
FontFace=#FontMono#
FontSize=(9*#S#)
FontWeight=500
FontColor=#TextMuted#
StringAlign=Right
AntiAlias=1
Text="[edit]"
ToolTipText="Set optional /usage tier quotas in agy-quota.json"
MouseOverAction=[!SetOption MeterEditBtn FontColor "#TermGreen#"][!UpdateMeter MeterEditBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterEditBtn FontColor "#TextMuted#"][!UpdateMeter MeterEditBtn][!Redraw]
LeftMouseUpAction=["#@#agy-quota.json"]

[MeterCloseBtn]
