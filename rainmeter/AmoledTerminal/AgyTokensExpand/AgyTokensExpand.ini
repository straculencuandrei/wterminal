X=(Round(18*#S#))
Y=(Round(13*#S#))
FontFace=#FontText#
FontSize=(11*#S#)
FontWeight=600
FontColor=#TextSecondary#
AntiAlias=1
Text="Usage"

[MeterEditBtn]
Meter=String
X=(Round(256*#S#))
Y=(Round(13*#S#))
FontFace=#FontMono#
FontSize=(9*#S#)
FontWeight=500
FontColor=#TextMuted#
StringAlign=Right
AntiAlias=1
Text="[edit]"
ToolTipText="Update synced Antigravity /usage quota in agy-quota.json"
MouseOverAction=[!SetOption MeterEditBtn FontColor "#TermGreen#"][!UpdateMeter MeterEditBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterEditBtn FontColor "#TextMuted#"][!UpdateMeter MeterEditBtn][!Redraw]
LeftMouseUpAction=["#@#agy-quota.json"]

[MeterCloseBtn]
Meter=String
X=(Round(286*#S#))
Y=(Round(13*#S#))
FontFace=#FontMono#
FontSize=(10*#S#)
FontWeight=700
FontColor=#TextMuted#
StringAlign=Right
AntiAlias=1
Text="[x]"
MouseOverAction=[!SetOption MeterCloseBtn FontColor "#TextPrimary#"][!UpdateMeter MeterCloseBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterCloseBtn FontColor "#TextMuted#"][!UpdateMeter MeterCloseBtn][!Redraw]
LeftMouseUpAction=[!DeactivateConfig]

