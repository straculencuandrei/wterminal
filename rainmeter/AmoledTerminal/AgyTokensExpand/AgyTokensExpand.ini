[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=AmoledTerminal
OnRefreshAction=[!CommandMeasure MeasureAgyCmd "Run"][!CommandMeasure MeasureLayout "PositionExpand()" "AmoledTerminal\HeroClock"]

[Metadata]
Name=AMOLED Terminal - AgyTokensExpand
Author=windows-custom-walliee
Information=Expanded Antigravity Usage drawer showing Gemini Models, Claude and GPT models, Gemini 4 Argon, and live local telemetry.
Version=1.0.0

[Variables]
@Include=#@#Variables.inc

[MeasureTicker]
Measure=Calc
Formula=MeasureTicker + 1
IfCondition=(MeasureTicker > 2) && ((MeasureTicker % 15) = 0)
IfTrueAction=[!CommandMeasure MeasureAgyCmd "Run"]

[MeasureAgyCmd]
Measure=Plugin
Plugin=RunCommand
Program=python
Parameter="#@#GetAgyUsage.py" #AgyContextLimit# #AgyDailyLimit# expand
State=Hide
OutputType=UTF8
FinishAction=[!UpdateMeasureGroup AgyExp][!UpdateMeter *][!Redraw]

; Group 1: Gemini Models (Weekly + 5h)
[MeasureGwLbl]
Measure=String
String=[MeasureAgyCmd]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^([^|]*)\|.*":"\1"
Group=AgyExp

[MeasureGwVal]
Measure=String
String=[MeasureAgyCmd]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^(?:[^|]*\|){1}([^|]*)\|.*":"\1"
Group=AgyExp

[MeasureGwNum]
Measure=Calc
Formula=MeasureGwVal
MinValue=0
MaxValue=100
DynamicVariables=1
Group=AgyExp

[MeasureGwCol]
Measure=String
String=[MeasureAgyCmd]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^(?:[^|]*\|){2}([^|]*)\|.*":"\1"
