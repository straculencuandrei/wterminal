[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=AmoledTerminal

[Metadata]
Name=AMOLED Terminal - PowerAudio
Author=windows-custom-walliee
Information=Minimal battery, AC status, C: free disk space, and scroll-wheel volume widget.
Version=1.0.0

[Variables]
@Include=#@#Variables.inc

[MeasureBatPct]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent

[MeasureAcState]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLine
Substitute="1":"AC","0":"BAT"

[MeasureDiskFree]
Measure=FreeDiskSpace
Drive=C:

[MeasureVol]
Measure=Plugin
Plugin=Win7AudioPlugin

[MeasureVolNum]
Measure=Calc
Formula=MeasureVol

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(110*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#
MouseScrollUpAction=[!CommandMeasure MeasureVol "ChangeVolume 4"]
MouseScrollDownAction=[!CommandMeasure MeasureVol "ChangeVolume -4"]

[MeterDot]
Meter=Shape
X=(Round(18*#S#))
Y=(Round(16*#S#))
Shape=Ellipse (Round(3*#S#)),(Round(3*#S#)),(Max(1,Round(3*#S#))) | Fill Color #TermGreen# | StrokeWidth 0

[MeterHeader]
Meter=String
X=(Round(30*#S#))
Y=(Round(11*#S#))
FontFace=#FontMono#
FontSize=(9*#FS#)
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="// sys.pwr"

[MeterAcBadge]
Meter=String
MeasureName=MeasureAcState
X=(Round(254*#S#))
Y=(Round(11*#S#))
FontFace=#FontMono#
FontSize=(9*#FS#)
FontWeight=700
FontColor=#TermGreen#
StringAlign=Right
AntiAlias=1
Text="[%1]"

[MeterBatLabel]
Meter=String
X=(Round(18*#S#))
Y=(Round(34*#S#))
FontFace=#FontMono#
FontSize=(10*#FS#)
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="bat"

[MeterBatVal]
Meter=String
MeasureName=MeasureBatPct
X=(Round(254*#S#))
Y=(Round(34*#S#))
FontFace=#FontMono#
FontSize=(10*#FS#)
FontWeight=700
FontColor=#TextPrimary#
StringAlign=Right
AntiAlias=1
Text="%1%"

[MeterBatBar]
Meter=Bar
MeasureName=MeasureBatPct
X=(Round(18*#S#))
Y=(Round(52*#S#))
W=(Max(1,Round(236*#S#)))
H=(Max(1,Round(3*#S#)))
BarOrientation=Horizontal
BarColor=#Accent#
SolidColor=#BarTrack#

[MeterVolLabel]
Meter=String
X=(Round(18*#S#))
Y=(Round(65*#S#))
FontFace=#FontMono#
FontSize=(10*#FS#)
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="vol (scroll)"
LeftMouseUpAction=[!CommandMeasure MeasureVol "ToggleMute"]

[MeterVolVal]
Meter=String
MeasureName=MeasureVolNum
X=(Round(254*#S#))
Y=(Round(65*#S#))
FontFace=#FontMono#
FontSize=(10*#FS#)
FontWeight=700
FontColor=#TextPrimary#
StringAlign=Right
AntiAlias=1
Text="%1%"
LeftMouseUpAction=[!CommandMeasure MeasureVol "ToggleMute"]

[MeterDiskLabel]
Meter=String
X=(Round(18*#S#))
Y=(Round(87*#S#))
FontFace=#FontMono#
FontSize=(9*#FS#)
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="c:\"

[MeterDiskVal]
Meter=String
MeasureName=MeasureDiskFree
X=(Round(254*#S#))
Y=(Round(87*#S#))
FontFace=#FontMono#
FontSize=(9*#FS#)
FontWeight=500
FontColor=#TextSecondary#
StringAlign=Right
AntiAlias=1
AutoScale=1
NumOfDecimals=1
Text="%1B free"
