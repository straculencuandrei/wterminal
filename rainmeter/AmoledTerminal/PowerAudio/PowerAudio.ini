[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=AMOLED Terminal - PowerAudio
Author=windows-custom-walliee
Information=Minimal battery, AC status, C: free disk space, and scroll-wheel volume widget.
Version=1.0.0

[Variables]
@Include=#@#Variables.inc

[MeasureBatPct]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent

[MeasureAcState]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLine
Substitute="1":"AC","0":"BAT"

[MeasureDiskFree]
Measure=FreeDiskSpace
Drive=C:

[MeasureVol]
Measure=Plugin
Plugin=Win7AudioPlugin

[MeasureVolNum]
Measure=Calc
Formula=MeasureVol

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,272,110,14 | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#
MouseScrollUpAction=[!CommandMeasure MeasureVol "ChangeVolume 4"]
MouseScrollDownAction=[!CommandMeasure MeasureVol "ChangeVolume -4"]

[MeterDot]
Meter=Shape
X=18
Y=16
Shape=Ellipse 3,3,3 | Fill Color #TermGreen# | StrokeWidth 0

[MeterHeader]
Meter=String
X=30
Y=11
FontFace=#FontMono#
FontSize=9
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="// sys.pwr"

[MeterAcBadge]
Meter=String
MeasureName=MeasureAcState
X=254
Y=11
FontFace=#FontMono#
FontSize=9
FontWeight=700
FontColor=#TermGreen#
StringAlign=Right
AntiAlias=1
Text="[%1]"

[MeterBatLabel]
Meter=String
X=18
Y=34
FontFace=#FontMono#
FontSize=10
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="bat"

[MeterBatVal]
Meter=String
MeasureName=MeasureBatPct
X=254
Y=34
FontFace=#FontMono#
FontSize=10
FontWeight=700
FontColor=#TextPrimary#
StringAlign=Right
AntiAlias=1
Text="%1%"

[MeterBatBar]
Meter=Bar
MeasureName=MeasureBatPct
X=18
Y=52
W=236
H=3
BarOrientation=Horizontal
BarColor=#Accent#
SolidColor=#BarTrack#

[MeterVolLabel]
Meter=String
X=18
Y=65
FontFace=#FontMono#
FontSize=10
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="vol (scroll)"
LeftMouseUpAction=[!CommandMeasure MeasureVol "ToggleMute"]

[MeterVolVal]
Meter=String
MeasureName=MeasureVolNum
X=254
Y=65
FontFace=#FontMono#
FontSize=10
FontWeight=700
FontColor=#TextPrimary#
StringAlign=Right
AntiAlias=1
Text="%1%"
LeftMouseUpAction=[!CommandMeasure MeasureVol "ToggleMute"]

[MeterDiskLabel]
Meter=String
X=18
Y=87
FontFace=#FontMono#
FontSize=9
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="c:\"

[MeterDiskVal]
Meter=String
MeasureName=MeasureDiskFree
X=254
Y=87
FontFace=#FontMono#
FontSize=9
FontWeight=500
FontColor=#TextSecondary#
StringAlign=Right
AntiAlias=1
AutoScale=1
NumOfDecimals=1
Text="%1B free"
