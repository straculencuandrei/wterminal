[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=AMOLED Terminal - HeroClock
Author=windows-custom-walliee
Information=Bold minimal AMOLED terminal clock, date, and uptime card.
Version=1.0.0

[Variables]
@Include=#@#Variables.inc

[MeasureTime]
Measure=Time
Format=#TimeFormat#

[MeasureSec]
Measure=Time
Format=:%S

[MeasureDate]
Measure=Time
Format=%A · %Y-%m-%d

[MeasureUptime]
Measure=Uptime
Format="%4!02i!h %3!02i!m"

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,272,122,14 | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#
MouseOverAction=[!SetOption MeterBg Shape "Rectangle 0,0,272,122,14 | Fill Color #BgHover# | StrokeWidth 1 | Stroke Color #HighlightBorder#"][!UpdateMeter MeterBg][!Redraw]
MouseLeaveAction=[!SetOption MeterBg Shape "Rectangle 0,0,272,122,14 | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#"][!UpdateMeter MeterBg][!Redraw]
LeftMouseUpAction=["ms-clock:"]

[MeterDot]
Meter=Shape
X=18
Y=16
Shape=Ellipse 3,3,3 | Fill Color #TermGreen# | StrokeWidth 0

[MeterHeader]
Meter=String
X=30
Y=11
FontFace=#FontMono#
FontSize=9
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="// clk.local"

[MeterUptime]
Meter=String
MeasureName=MeasureUptime
X=254
Y=11
FontFace=#FontMono#
FontSize=9
FontWeight=500
FontColor=#TextMuted#
StringAlign=Right
AntiAlias=1
Text="up %1"

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=118
Y=34
FontFace=#FontMono#
FontSize=32
FontWeight=700
FontColor=#TextPrimary#
StringAlign=CenterTop
AntiAlias=1
Text="%1"

[MeterSec]
Meter=String
MeasureName=MeasureSec
X=194
Y=42
FontFace=#FontMono#
FontSize=13
FontWeight=500
FontColor=#TextMuted#
StringAlign=LeftTop
AntiAlias=1
Text="%1"

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=136
Y=92
FontFace=#FontMono#
FontSize=10
FontWeight=500
FontColor=#TextSecondary#
StringAlign=CenterTop
AntiAlias=1
Text="%1"
