[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=AmoledTerminal

[Metadata]
Name=AMOLED Terminal - HeroClock
Author=windows-custom-walliee
Information=Bold minimal AMOLED terminal clock, date, and uptime card.
Version=1.0.0

[Variables]
@Include=#@#Variables.inc

[MeasureTime]
Measure=Time
Format=#TimeFormat#

[MeasureSec]
Measure=Time
Format=:%S

[MeasureDate]
Measure=Time
Format=%A · %Y-%m-%d

[MeasureUptime]
Measure=Uptime
Format="%4!02i!h %3!02i!m"

[MeasureMonW]
Measure=Plugin
Plugin=SysInfo
SysInfoType=WORK_AREA_WIDTH
UpdateDivider=2

[MeasureMonH]
Measure=Plugin
Plugin=SysInfo
SysInfoType=WORK_AREA_HEIGHT
UpdateDivider=2

[MeasureNumMon]
Measure=Plugin
Plugin=SysInfo
SysInfoType=NUM_MONITORS
UpdateDivider=2

[MeasureLayout]
Measure=Script
ScriptFile=#@#Layout.lua
UpdateDivider=2

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(122*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#
MouseOverAction=[!SetOption MeterBg Shape "Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(122*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgHover# | StrokeWidth 1 | Stroke Color #HighlightBorder#"][!UpdateMeter MeterBg][!Redraw]
MouseLeaveAction=[!SetOption MeterBg Shape "Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(122*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#"][!UpdateMeter MeterBg][!Redraw]
LeftMouseUpAction=["ms-clock:"]

[MeterDot]
Meter=Shape
X=(Round(18*#S#))
Y=(Round(16*#S#))
Shape=Ellipse (Round(3*#S#)),(Round(3*#S#)),(Max(1,Round(3*#S#))) | Fill Color #TermGreen# | StrokeWidth 0

[MeterHeader]
Meter=String
X=(Round(30*#S#))
Y=(Round(11*#S#))
FontFace=#FontMono#
FontSize=(9*#S#)
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="// clk.local"

[MeterUptime]
Meter=String
MeasureName=MeasureUptime
X=(Round(254*#S#))
Y=(Round(11*#S#))
FontFace=#FontMono#
FontSize=(9*#S#)
FontWeight=500
FontColor=#TextMuted#
StringAlign=Right
AntiAlias=1
Text="up %1"

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=(Round(118*#S#))
Y=(Round(34*#S#))
FontFace=#FontMono#
FontSize=(32*#S#)
FontWeight=700
FontColor=#TextPrimary#
StringAlign=CenterTop
AntiAlias=1
Text="%1"

[MeterSec]
Meter=String
MeasureName=MeasureSec
X=(Round(194*#S#))
Y=(Round(42*#S#))
FontFace=#FontMono#
FontSize=(13*#S#)
FontWeight=500
FontColor=#TextMuted#
StringAlign=LeftTop
AntiAlias=1
Text="%1"

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=(Round(136*#S#))
Y=(Round(92*#S#))
FontFace=#FontMono#
FontSize=(10*#S#)
FontWeight=500
FontColor=#TextSecondary#
StringAlign=CenterTop
AntiAlias=1
Text="%1"
