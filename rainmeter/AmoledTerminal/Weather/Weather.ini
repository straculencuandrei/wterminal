[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=AmoledTerminal

[Metadata]
Name=AMOLED Terminal - Weather
Author=windows-custom-walliee
Information=Minimal AMOLED terminal weather widget using wttr.in auto-location.
Version=1.0.0

[Variables]
@Include=#@#Variables.inc

[MeasureWeather]
Measure=WebParser
URL=https://wttr.in/?format=%t|%C|%w|%l
RegExp=(?siU)^([^|]*)\|([^|]*)\|([^|]*)\|(.*)$
UpdateRate=900
FinishAction=[!UpdateMeasure *][!UpdateMeter *][!Redraw]

[MeasureTemp]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=1
Substitute="+":""

[MeasureCond]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=2

[MeasureWind]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=3

[MeasureLoc]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=4
Substitute=", Romania":""," County":""

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(96*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#
MouseOverAction=[!SetOption MeterBg Shape "Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(96*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgHover# | StrokeWidth 1 | Stroke Color #HighlightBorder#"][!UpdateMeter MeterBg][!Redraw]
MouseLeaveAction=[!SetOption MeterBg Shape "Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(96*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#"][!UpdateMeter MeterBg][!Redraw]
LeftMouseUpAction=[!CommandMeasure MeasureWeather "Update"]

[MeterDot]
Meter=Shape
X=(Round(18*#S#))
Y=(Round(16*#S#))
Shape=Ellipse (Round(3*#S#)),(Round(3*#S#)),(Max(1,Round(3*#S#))) | Fill Color #TermGreen# | StrokeWidth 0

[MeterHeader]
Meter=String
X=(Round(30*#S#))
Y=(Round(11*#S#))
FontFace=#FontMono#
FontSize=(9*#S#)
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="// env.wx"

[MeterLoc]
Meter=String
MeasureName=MeasureLoc
X=(Round(254*#S#))
Y=(Round(11*#S#))
W=(Max(1,Round(145*#S#)))
H=(Max(1,Round(15*#S#)))
ClipString=1
FontFace=#FontMono#
FontSize=(9*#S#)
FontWeight=500
FontColor=#TextMuted#
StringAlign=Right
AntiAlias=1
Text="%1"

[MeterTemp]
Meter=String
MeasureName=MeasureTemp
X=(Round(18*#S#))
Y=(Round(36*#S#))
FontFace=#FontMono#
FontSize=(22*#S#)
FontWeight=700
FontColor=#TextPrimary#
AntiAlias=1
Text="%1"

[MeterCond]
Meter=String
MeasureName=MeasureCond
X=(Round(254*#S#))
Y=(Round(40*#S#))
W=(Max(1,Round(140*#S#)))
ClipString=1
FontFace=#FontMono#
FontSize=(11*#S#)
FontWeight=500
FontColor=#TextSecondary#
StringAlign=Right
AntiAlias=1
Text="%1"

[MeterWind]
Meter=String
MeasureName=MeasureWind
X=(Round(254*#S#))
Y=(Round(62*#S#))
FontFace=#FontMono#
FontSize=(9*#S#)
FontWeight=500
FontColor=#TextMuted#
StringAlign=Right
AntiAlias=1
Text="wind %1"
