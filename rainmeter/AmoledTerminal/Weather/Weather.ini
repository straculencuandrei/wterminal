[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=AMOLED Terminal - Weather
Author=windows-custom-walliee
Information=Minimal AMOLED terminal weather widget using wttr.in auto-location.
Version=1.0.0

[Variables]
@Include=#@#Variables.inc

[MeasureWeather]
Measure=WebParser
URL=https://wttr.in/?format=%t|%C|%w|%l
RegExp=(?siU)^([^|]*)\|([^|]*)\|([^|]*)\|(.*)$
UpdateRate=900
FinishAction=[!UpdateMeasure *][!UpdateMeter *][!Redraw]

[MeasureTemp]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=1
Substitute="+":""

[MeasureCond]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=2

[MeasureWind]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=3

[MeasureLoc]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=4
Substitute=", Romania":""," County":""

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,272,96,14 | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#
MouseOverAction=[!SetOption MeterBg Shape "Rectangle 0,0,272,96,14 | Fill Color #BgHover# | StrokeWidth 1 | Stroke Color #HighlightBorder#"][!UpdateMeter MeterBg][!Redraw]
MouseLeaveAction=[!SetOption MeterBg Shape "Rectangle 0,0,272,96,14 | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#"][!UpdateMeter MeterBg][!Redraw]
LeftMouseUpAction=[!CommandMeasure MeasureWeather "Update"]

[MeterDot]
Meter=Shape
X=18
Y=16
Shape=Ellipse 3,3,3 | Fill Color #TermGreen# | StrokeWidth 0

[MeterHeader]
Meter=String
X=30
Y=11
FontFace=#FontMono#
FontSize=9
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="// env.wx"

[MeterLoc]
Meter=String
MeasureName=MeasureLoc
X=254
Y=11
W=145
H=15
ClipString=1
FontFace=#FontMono#
FontSize=9
FontWeight=500
FontColor=#TextMuted#
StringAlign=Right
AntiAlias=1
Text="%1"

[MeterTemp]
Meter=String
MeasureName=MeasureTemp
X=18
Y=36
FontFace=#FontMono#
FontSize=22
FontWeight=700
FontColor=#TextPrimary#
AntiAlias=1
Text="%1"

[MeterCond]
Meter=String
MeasureName=MeasureCond
X=254
Y=40
W=140
ClipString=1
FontFace=#FontMono#
FontSize=11
FontWeight=500
FontColor=#TextSecondary#
StringAlign=Right
AntiAlias=1
Text="%1"

[MeterWind]
Meter=String
MeasureName=MeasureWind
X=254
Y=62
FontFace=#FontMono#
FontSize=9
FontWeight=500
FontColor=#TextMuted#
StringAlign=Right
AntiAlias=1
Text="wind %1"
