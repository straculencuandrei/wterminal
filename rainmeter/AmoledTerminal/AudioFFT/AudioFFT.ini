[Rainmeter]
Update=40
AccurateText=1
DynamicWindowSize=1
Group=AmoledTerminal

[Metadata]
Name=AMOLED Terminal - AudioFFT
Author=windows-custom-walliee
Information=Ultra-minimal 24-band monochrome audio spectrum pill above the dock.
Version=1.1.0

[Variables]
@Include=#@#Variables.inc

[MeasureAudio]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=2048
FFTOverlap=1024
FFTAttack=25
FFTDecay=180
FreqMin=45
FreqMax=14000
Bands=24
Sensitivity=46

[MeasureAudioDev]
Measure=Plugin
Plugin=Win7AudioPlugin
UpdateDivider=50

[MeasureAudioGuard]
Measure=Script
ScriptFile=#@#AudioGuard.lua
UpdateDivider=50

[MeasureBand0]
