[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=AmoledTerminal
OnRefreshAction=[!CommandMeasure MeasureAgyCmd "Run"]

[Metadata]
Name=AMOLED Terminal - AgyTokens
Author=windows-custom-walliee
Information=Live Google Antigravity token usage, limit, spent, and remaining widget.
Version=1.0.0

[Variables]
@Include=#@#Variables.inc

[MeasureTicker]
Measure=Calc
Formula=MeasureTicker + 1
IfCondition=(MeasureTicker > 2) && ((MeasureTicker % 15) = 0)
IfTrueAction=[!CommandMeasure MeasureAgyCmd "Run"]

[MeasureAgyCmd]
Measure=Plugin
Plugin=RunCommand
Program=python
Parameter="#@#GetAgyUsage.py" #AgyContextLimit# #AgyDailyLimit#
State=Hide
OutputType=UTF8
FinishAction=[!UpdateMeasureGroup AgyParse][!UpdateMeter *][!Redraw]

[MeasureRemPct]
Measure=String
String=[MeasureAgyCmd]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^([^|]*)\|.*":"\1"
Group=AgyParse

[MeasureCtxText]
Measure=String
String=[MeasureAgyCmd]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^[^|]*\|([^|]*)\|.*":"\1"
Group=AgyParse

[MeasureSpentPct]
Measure=String
String=[MeasureAgyCmd]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^(?:[^|]*\|){2}([^|]*)\|.*":"\1"
Group=AgyParse

[MeasureSpentPctNum]
Measure=Calc
Formula=MeasureSpentPct
MinValue=0
MaxValue=100
DynamicVariables=1
Group=AgyParse

[MeasureCtxRem]
Measure=String
String=[MeasureAgyCmd]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^(?:[^|]*\|){3}([^|]*)\|.*":"\1"
Group=AgyParse

[MeasureDayText]
Measure=String
String=[MeasureAgyCmd]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^(?:[^|]*\|){4}([^|]*)\|.*":"\1"
Group=AgyParse

[MeasureDayPct]
Measure=String
String=[MeasureAgyCmd]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^(?:[^|]*\|){5}([^|]*)\|.*":"\1"
Group=AgyParse

[MeasureDayPctNum]
Measure=Calc
Formula=MeasureDayPct
MinValue=0
MaxValue=100
DynamicVariables=1
Group=AgyParse

[MeasureDayRem]
Measure=String
String=[MeasureAgyCmd]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^(?:[^|]*\|){6}([^|\r\n]*)\|.*":"\1"
Group=AgyParse

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(122*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#
MouseOverAction=[!SetOption MeterBg Shape "Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(122*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgHover# | StrokeWidth 1 | Stroke Color #HighlightBorder#"][!UpdateMeter MeterBg][!Redraw]
MouseLeaveAction=[!SetOption MeterBg Shape "Rectangle 0,0,(Max(1,Round(272*#S#))),(Max(1,Round(122*#S#))),(Max(1,Round(14*#S#))) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#"][!UpdateMeter MeterBg][!Redraw]
LeftMouseUpAction=[!ToggleConfig "AmoledTerminal\AgyTokensExpand" "AgyTokensExpand.ini"][!CommandMeasure MeasureAgyCmd "Run"]
ToolTipText="Click to expand Antigravity Usage breakdown"

[MeterDot]
Meter=Shape
X=(Round(18*#S#))
Y=(Round(16*#S#))
Shape=Ellipse (Round(3*#S#)),(Round(3*#S#)),(Max(1,Round(3*#S#))) | Fill Color #TermGreen# | StrokeWidth 0

[MeterHeader]
Meter=String
X=(Round(30*#S#))
Y=(Round(11*#S#))
FontFace=#FontMono#
FontSize=(9*#S#)
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="// agy.tok [+]"

[MeterRemBadge]
Meter=String
MeasureName=MeasureRemPct
MeasureName2=MeasureCtxRem
X=(Round(254*#S#))
Y=(Round(11*#S#))
FontFace=#FontMono#
FontSize=(9*#S#)
FontWeight=700
FontColor=#TermGreen#
StringAlign=Right
AntiAlias=1
Text="%1% left (%2)"

[MeterCtxLabel]
Meter=String
X=(Round(18*#S#))
Y=(Round(34*#S#))
FontFace=#FontMono#
FontSize=(10*#S#)
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="ctx.spent"

[MeterCtxVal]
Meter=String
MeasureName=MeasureCtxText
X=(Round(254*#S#))
Y=(Round(34*#S#))
FontFace=#FontMono#
FontSize=(10*#S#)
FontWeight=700
FontColor=#TextPrimary#
StringAlign=Right
AntiAlias=1
Text="%1"

[MeterCtxBar]
Meter=Bar
MeasureName=MeasureSpentPctNum
X=(Round(18*#S#))
Y=(Round(52*#S#))
W=(Max(1,Round(236*#S#)))
H=(Max(1,Round(3*#S#)))
BarOrientation=Horizontal
BarColor=#Accent#
SolidColor=#BarTrack#

[MeterDayLabel]
Meter=String
X=(Round(18*#S#))
Y=(Round(65*#S#))
FontFace=#FontMono#
FontSize=(10*#S#)
FontWeight=500
FontColor=#TextSecondary#
AntiAlias=1
Text="24h.spent"

[MeterDayVal]
Meter=String
MeasureName=MeasureDayText
X=(Round(254*#S#))
Y=(Round(65*#S#))
FontFace=#FontMono#
FontSize=(10*#S#)
FontWeight=700
FontColor=#TextPrimary#
StringAlign=Right
AntiAlias=1
Text="%1"

[MeterDayBar]
Meter=Bar
MeasureName=MeasureDayPctNum
X=(Round(18*#S#))
Y=(Round(83*#S#))
W=(Max(1,Round(236*#S#)))
H=(Max(1,Round(3*#S#)))
BarOrientation=Horizontal
BarColor=#Accent#
SolidColor=#BarTrack#

[MeterRemLabel]
Meter=String
X=(Round(18*#S#))
Y=(Round(97*#S#))
FontFace=#FontMono#
FontSize=(9*#S#)
FontWeight=500
FontColor=#TextMuted#
AntiAlias=1
Text="24h.rem"

[MeterRemVal]
Meter=String
MeasureName=MeasureDayRem
X=(Round(254*#S#))
Y=(Round(97*#S#))
FontFace=#FontMono#
FontSize=(9*#S#)
FontWeight=700
FontColor=#TermGreen#
StringAlign=Right
AntiAlias=1
Text="%1 left"
